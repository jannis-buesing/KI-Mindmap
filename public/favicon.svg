<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d6d6d6"/>
      <stop offset="100%" stop-color="#c9c9c9"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Vollflächiger quadratischer Hintergrund -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Dezente Hintergrundstruktur für mehr Flächennutzung -->
  <g opacity="0.04" stroke="#000000" fill="none">
    <circle cx="120" cy="120" r="220"/>
    <circle cx="940" cy="160" r="260"/>
    <circle cx="860" cy="900" r="320"/>
    <circle cx="140" cy="860" r="280"/>
  </g>

  <!-- Mindmap -->
  <g filter="url(#shadow)">
    <!-- Äste -->
    <g stroke="#000000"
       stroke-width="16"
       stroke-linecap="round"
       stroke-linejoin="round"
       fill="none">

      <!-- nach oben links -->
      <path d="M512 512 C470 450 420 380 360 290"/>

      <!-- nach oben rechts (größter Ast) -->
      <path d="M512 512 C610 470 690 390 780 250"/>

      <!-- rechts -->
      <path d="M512 512 C620 525 710 520 845 565"/>

      <!-- unten rechts -->
      <path d="M512 512 C560 610 640 690 735 810"/>

      <!-- unten links -->
      <path d="M512 512 C430 560 350 690 245 790"/>

      <!-- links mitte -->
      <path d="M512 512 C455 500 180 505 190 480"/>
    </g>

    <!-- Knoten -->
    <g fill="#acfff8" stroke="#000000" stroke-width="16">

      <!-- Zentrum -->
      <circle cx="512" cy="512" r="86"/>

      <!-- Leaf Nodes unterschiedlich groß -->
      <circle cx="360" cy="290" r="46"/>
      <circle cx="780" cy="250" r="54"/> <!-- größter Leaf -->
      <circle cx="845" cy="565" r="40"/>
      <circle cx="735" cy="810" r="52"/>
      <circle cx="245" cy="790" r="44"/>
      <circle cx="200" cy="490" r="36"/>
    </g>
  </g>
</svg>